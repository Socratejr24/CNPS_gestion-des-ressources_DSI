<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hors connexion — Gestion des ressources DSI · CNPS</title>

    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #f5f6fa;
            font-family: 'Inter', system-ui, sans-serif;
            color: #1b2140;
            display: flex;
            flex-direction: column;
        }

        .bar {
            display: flex;
            height: 6px;
        }

        .bar span { flex: 1; }
        .bar span:nth-child(1) { background: #27357e; }
        .bar span:nth-child(2) { background: #de7c0f; }
        .bar span:nth-child(3) { background: #088e39; }
        .bar span:nth-child(4) { background: #f6d01d; }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #fdf0e1;
            color: #de7c0f;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 0.95rem;
            color: #6b7190;
            line-height: 1.6;
            max-width: 420px;
            margin: 0 0 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            background: #27357e;
            color: #fff;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.15s ease;
            border: 0;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d2865;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(39, 53, 126, 0.25);
        }

        .footer {
            font-size: 0.75rem;
            color: #a8adc7;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="bar">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="container">
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
        </div>

        <h1>Vous êtes hors connexion</h1>
        <p>Impossible de contacter le serveur. Vérifiez votre connexion internet et réessayez.</p>

        <button onclick="window.location.reload()" class="btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            Réessayer
        </button>

        <p class="footer">© 2026 CNPS — Direction du Système d'Information</p>
    </div>

    <script>
        // Auto-retry toutes les 5 secondes
        setInterval(() => {
            if (navigator.onLine) {
                window.location.href = '/dashboard';
            }
        }, 5000);
    </script>
</body>
</html>
